<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chaniel | Contact</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #050509;
            color: white;
            font-family: Arial, sans-serif;
        }

        nav {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(5, 5, 9, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid #20202c;
            z-index: 1000;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 3px;
        }

        .logo span {
            color: #6c63ff;
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-left: 25px;
            font-size: 15px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #6c63ff;
        }

        .contact {
            min-height: 100vh;
            padding: 150px 20px 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .contact-box {
            width: 100%;
            max-width: 650px;
            text-align: center;
            background: linear-gradient(145deg, #111119, #08080d);
            border: 1px solid #242432;
            border-radius: 25px;
            padding: 50px 35px;
            box-shadow: 0 20px 60px rgba(108, 99, 255, 0.08);
        }

        .small-text {
            color: #6c63ff;
            letter-spacing: 4px;
            font-size: 13px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        .contact-box p {
            color: #999;
            font-size: 18px;
            line-height: 1.7;
            margin-bottom: 25px;
        }

        .socials {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 30px;
        }

        .social {
            display: inline-block;
            padding: 14px 25px;
            border: 1px solid #292938;
            border-radius: 30px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .social:hover {
            border-color: #6c63ff;
            background: #121020;
            transform: translateY(-4px);
        }

        footer {
            text-align: center;
            padding: 35px;
            border-top: 1px solid #181820;
            color: #666;
        }

        footer span {
            color: #6c63ff;
        }

        @media (max-width: 700px) {
            nav {
                padding: 18px 5%;
            }

            .logo {
                font-size: 19px;
            }

            nav a {
                margin-left: 8px;
                font-size: 12px;
            }

            h1 {
                font-size: 42px;
            }
        }
    </style>
</head>

<body>

    <nav>

        <div class="logo">
            CHANIEL<span>.</span>
        </div>

        <div>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
        </div>

    </nav>


    <div class="contact">

        <div class="contact-box">

            <div class="small-text">LET'S CONNECT</div>

            <h1>Contact Me</h1>

            <p>
                Thanks for checking out my website.
                If you want to connect with me, you can
                find me on my social platforms.
            </p>

            <div class="socials">

                <a class="social" href="#">
                    📱 TikTok
                </a>

                <a class="social" href="#">
                    📸 Instagram
                </a>

            </div>

        </div>

    </div>


    <footer>
        © 2026 <span>CHANIEL</span> — Built from scratch.
    </footer>

</body>
</html>
