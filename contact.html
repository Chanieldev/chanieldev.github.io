<style>
    .contact-page {
        min-height: 80vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 40px 20px;
    }

    .contact-page h1 {
        font-size: 3rem;
        margin-bottom: 15px;
    }

    .contact-page p {
        max-width: 600px;
        margin-bottom: 35px;
        line-height: 1.7;
    }

    .contact-links {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
    }

    .contact-links a {
        display: inline-block;
        padding: 15px 25px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: bold;
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .contact-links a:hover {
        transform: translateY(-5px);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
    }
</style>
